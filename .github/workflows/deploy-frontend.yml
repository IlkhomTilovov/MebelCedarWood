name: Deploy CEDAR WOOD Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Normalize host secret
        id: host
        run: |
          value=$(printf '%s' "${{ secrets.VPS_HOST }}" | tr -d '[:space:]')
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.host.outputs.value }}" >> ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          VPS_HOST: ${{ steps.host.outputs.value }}
        run: |
          ssh "root@$VPS_HOST" "mkdir -p /var/www/cedarwood"
          tar -czf - -C frontend/dist . | ssh -o ConnectTimeout=20 -o BatchMode=yes "root@$VPS_HOST" "tar -xzf - -C /var/www/cedarwood && chown -R www-data:www-data /var/www/cedarwood"

      - name: Health check
        run: |
          sleep 2
          curl -fsS "https://mebel.com.uz/"
