name: Deploy CEDAR WOOD API

on:
  push:
    branches: [main]
    paths:
      - 'backend/cedarwood-api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize host secret
        id: host
        run: |
          value=$(printf '%s' "${{ secrets.VPS_HOST }}" | tr -d '[:space:]')
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.host.outputs.value }}" >> ~/.ssh/known_hosts

      - name: Sync application files
        env:
          REMOTE_CMD: "mkdir -p /opt/cedarwood-api && tar -xzf - -C /opt/cedarwood-api"
          VPS_HOST: ${{ steps.host.outputs.value }}
        run: tar -czf - -C backend/cedarwood-api --exclude=node_modules --exclude=.env --exclude=counter.json . | ssh -o ConnectTimeout=20 -o BatchMode=yes "root@$VPS_HOST" "$REMOTE_CMD"

      - name: Install dependencies and configure service
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          VPS_HOST: ${{ steps.host.outputs.value }}
        run: |
          ssh "root@$VPS_HOST" "BOT_TOKEN='${BOT_TOKEN}' CHAT_ID='${CHAT_ID}' DATABASE_URL='${DATABASE_URL}' ADMIN_USERNAME='${ADMIN_USERNAME}' ADMIN_PASSWORD='${ADMIN_PASSWORD}' ALLOWED_ORIGINS='${ALLOWED_ORIGINS}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          id cedarwood >/dev/null 2>&1 || useradd -r -M -s /usr/sbin/nologin cedarwood

          cat > /opt/cedarwood-api/.env <<EOF
          BOT_TOKEN=${BOT_TOKEN}
          CHAT_ID=${CHAT_ID}
          PORT=4100
          DATABASE_URL=${DATABASE_URL}
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
          NODE_ENV=production
          EOF
          chmod 600 /opt/cedarwood-api/.env
          chown -R cedarwood:cedarwood /opt/cedarwood-api

          cd /opt/cedarwood-api
          npm ci --omit=dev --no-audit --no-fund

          cat > /etc/systemd/system/cedarwood-api.service <<'EOF'
          [Unit]
          Description=CEDAR WOOD application API (Telegram notifier)
          After=network.target

          [Service]
          Type=simple
          User=cedarwood
          WorkingDirectory=/opt/cedarwood-api
          EnvironmentFile=/opt/cedarwood-api/.env
          ExecStart=/usr/bin/node /opt/cedarwood-api/index.js
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > /etc/nginx/sites-available/cedarwood-api <<'EOF'
          server {
              server_name api.mebel.com.uz;

              location /api/admin/realtime/stream {
                  proxy_pass http://127.0.0.1:4100;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_buffering off;
                  proxy_cache off;
                  proxy_read_timeout 1h;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:4100;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              listen 443 ssl; # managed by Certbot
              ssl_certificate /etc/letsencrypt/live/mebel.com.uz/fullchain.pem; # managed by Certbot
              ssl_certificate_key /etc/letsencrypt/live/mebel.com.uz/privkey.pem; # managed by Certbot
              include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
          }
          server {
              if ($host = api.mebel.com.uz) {
                  return 301 https://$host$request_uri;
              } # managed by Certbot

              listen 80;
              server_name api.mebel.com.uz;
              return 404; # managed by Certbot
          }
          EOF
          ln -sf /etc/nginx/sites-available/cedarwood-api /etc/nginx/sites-enabled/cedarwood-api
          nginx -t
          systemctl reload nginx

          systemctl daemon-reload
          systemctl enable cedarwood-api
          systemctl restart cedarwood-api
          sleep 1
          systemctl is-active cedarwood-api
          REMOTE_SCRIPT

      - name: Health check
        run: |
          sleep 2
          curl -fsS "https://api.mebel.com.uz/api/health"
